<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Gelora Sport</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="left-side">
            <div class="overlay">
                <div class="hero-content">
                    <h1>Gelora Sport</h1>
                    <p>Sewa lapangan olahraga dengan mudah, cepat, dan terpercaya.</p>
                </div>
            </div>
        </div>

        <div class="right-side">
            <div class="form-card">
                <h2>LOGIN</h2>
                <p class="subtitle">Silakan isi data berikut</p>
                <form>
                    <div class="input-group">
                        <label>Nama Lengkap</label>
                        <input type="text" placeholder="Masukkan nama lengkap">
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Masukkan email">
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Buat password">
                    </div>
                    <button type="submit" class="btn-submit">Masuk Disini</button>
</body>
</html>
