<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Lapangan Olahraga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Gelora Sport</div>
        <nav>
            <a href="login.html">Masuk</a>
            <a href="#" class="btn-register">Daftar</a>
        </nav>
    </header>

    <section class="search-section">
        <div class="search-box">
            <input type="text" placeholder="Cari nama lapangan...">
            <button class="btn-search">Cari Lapangan</button>
        </div>
    </section>

    <main>
        <p class="subtitle">Menampilkan lapangan tersedia</p>
        <div class="venue-grid">
            
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYAe3t5oFAZMB5TDmZpOaw5Sy1J9c7NsIhRA&s" alt="Lapangan Badminton">
                <div class="card-content">
                    <h3>Lapangan Badminton</h3>
                    <p class="rating">⭐ 5.0 • Bandar Lampung</p>
                    <p class="sport-type">🎾 Badminton</p>
                    <p class="price">Mulai <strong>Rp 20.000</strong> /jam</p>
                </div>
            </div>

            <div class="card">
                <img src="https://asset.ayo.co.id/image/venue/170003399361601.image_cropper_246D9558-9BCD-4B7E-BD8B-BC836A3F7C4E-66032-000009DC36E81169_large.jpg" alt="Lapangan Basket">
                <div class="card-content">
                    <h3>Lapangan Basket</h3>
                    <p class="rating">⭐ 5.0 • Bandar Lampung</p>
                    <p class="sport-type">🏀 Basket</p>
                    <p class="price">Mulai <strong>Rp 30.000</strong> /jam</p>
                </div>
            </div>
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzwzU3_KVkLO1n8bcG6APpPR1XpHDiPhqZ5A&s" alt="Lapangan Futsal">
                <div class="card-content">
                    <h3>Lapangan Futsal</h3>
                    <p class="rating">⭐ 4.8 • Bandar Lampung</p>
                    <p class="sport-type">⚽ Futsal</p>
                    <p class="price">Mulai <strong>Rp 25.000</strong> /jam</p>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
