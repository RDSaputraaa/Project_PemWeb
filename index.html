<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelora Sport - Beranda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Gelora Sport</div>
        <div class="nav-menu">
            <a href="#" class="login-link">Masuk</a>

    <main class="catalog">
        <p class="subtitle">Menampilkan lapangan tersedia</p>
        
        <div class="card-container">
            <a href="detail.html" class="card">

                    <h3>Lapangan Badminton</h3>
                    <p class="info">⭐ 5.0 • Bandar Lampung</p>
                    <p class="category">🏸 Badminton</p>
                    <p class="price">Mulai <strong>Rp 20.000</strong> <span>/jam</span></p>
                </div>
            </a>

            <a href="detail.html" class="card">
                <img src="https://asset.ayo.co.id/image/venue/170003399361601.image_cropper_246D9558-9BCD-4B7E-BD8B-BC836A3F7C4E-66032-000009DC36E81169_large.jpg" alt="Lapangan Basket">

                    <h3>Lapangan Basket</h3>

            </a>

            <a href="detail.html" class="card">
               <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzwzU3_KVkLO1n8bcG6APpPR1XpHDiPhqZ5A&s" alt="Lapangan Futsal">
                <div class="card-body">
                    <h3>Lapangan Futsal</h3>
                    <p class="info">⭐ 4.8 • Bandar Lampung</p>
                    <p class="category">⚽ Futsal</p>
                    <p class="price">Mulai <strong>Rp 25.000</strong> <span>/jam</span></p>
                </div>
            </a>
        </div>
    </main>
